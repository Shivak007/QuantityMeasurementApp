# ============================================================
# Quantity Measurement Application - UC18 Config
# ============================================================
spring.application.name=quantity-measurement-app

# ============================================================
# H2 In-Memory Database (Development)
# ============================================================
spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
# JWT Configuration (UC18)
# ============================================================
# IMPORTANT: Replace secret with a 256-bit (32+ char) random string in production
app.jwt.secret=QuantityMeasurementAppUC18SecretKey2024!
app.jwt.expiration-ms=86400000

# ============================================================
# Google OAuth2 (UC18)
# ============================================================
# Replace with your actual Google OAuth2 Client ID from Google Cloud Console
app.google.client-id=862799044674-mve3f6ec0clma8qhfmscmqr32omqvi05.apps.googleusercontent.com

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================================
# Google OAuth2 Spring Security Configuration (UC18)
# ============================================================

spring.security.oauth2.client.registration.google.client-id={CLIENT ID}
spring.security.oauth2.client.registration.google.client-secret={CLIENT SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
# ============================================================
# Logging
# ============================================================
logging.level.com.app.quantitymeasurement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO
