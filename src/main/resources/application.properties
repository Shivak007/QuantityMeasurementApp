# ============================================================
# Quantity Measurement Application - Configuration
# UC16: JDBC Database Integration
# ============================================================

# Application Settings
app.name=QuantityMeasurementApp
app.version=1.0.0

# Repository Type: 'cache' for in-memory, 'database' for JDBC
repository.type=database

# ============================================================
# H2 In-Memory Database (Development / Testing)
# ============================================================
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:quantitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=RUNSCRIPT FROM 'classpath:db/schema.sql'
db.username=sa
db.password=

# ============================================================
# MySQL Database (Production - Commented Out)
# ============================================================
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/quantity_measurement_db?useSSL=false&serverTimezone=UTC
# db.username=root
# db.password=your_password

# ============================================================
# PostgreSQL Database (Production - Commented Out)
# ============================================================
# db.driver=org.postgresql.Driver
# db.url=jdbc:postgresql://localhost:5432/quantity_measurement_db
# db.username=postgres
# db.password=your_password

# ============================================================
# Connection Pool Settings
# ============================================================
db.pool.initialSize=5
db.pool.maxSize=10
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000

# ============================================================
# Logging Configuration
# ============================================================
logging.level=INFO
logging.file=logs/quantity-measurement.log
